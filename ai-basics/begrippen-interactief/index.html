<!-- Lettertypes (Google Fonts) -->

<!-- =====================================================================
     OPBOUW VAN DEZE PAGINA
     index.html            dit bestand: leerpad en de scripts
     css/basis.css         kleuren, lettertypes, knoppen, meldingen, animaties
     css/pagina.css        intro, leerpad, delen en de begrip-voor-begrip gids
     css/visuals.css       de schema's, per bestand in js/visuals/
     js/hulp.js            hulpfuncties en het register VISUALS
     js/inhoud.js          ALLE TEKST: intro, delen, begrippen, voorbeelden
     js/visuals/*.js       één bestand per deel met de schema's van dat deel
     js/app.js             bouwt de pagina op en regelt de navigatie

     Tekst aanpassen:      js/inhoud.js
     Volgorde aanpassen:   de volgorde van delen en begrippen in js/inhoud.js
     Nieuw schema:         voeg VISUALS.naam toe in js/visuals/<deel>.js en
                           zet  visual: 'naam'  bij het begrip in inhoud.js
     ===================================================================== -->
</head>

<body>
<nav class="leerpad" aria-label="Leerpad">
  <div class="wrap leerpad-binnen">
    <div class="leerpad-rij" id="leerpad-rij"></div>
  </div>
</nav>

<main class="wrap" id="hoofdstukken"></main>

<script src="js/app.js"></script>
